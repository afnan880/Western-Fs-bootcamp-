<h1> app component</h1>

<!-- interpolation -->

<div>
  <img src="{{ imageUrl }}" alt="Angular logo" width="200" height="200" />
</div>
<!-- property binding -->
<div>
  <img [src]="imageUrl" alt="Angular logo" width="200" height="200" />
</div>
<h1 [style.background-color]="bgColor">Hello, {{ name }}</h1>
<h2 [style]="stylestring">Personal details as following:</h2>

<ul>
  <li>Name: {{ person.name }}</li>
  <li>{{ 'Age: ' + person.age }}</li>
  <li>{{ 'City: ' + person.city }}</li>
</ul>
@for(p of personList; track p.name){
<li>{{ p.name }}</li>
<li>{{ p.age }}</li>
<li>{{ p.city }}</li>
}@empty{
<li>No person found</li>
}
<button [disabled]=isDisabled>disabled button</button>
<button [ngClass]="bgRedClass" disabled="{{isDisabled }}" [ngClass]=" true? 'disabled':'' ">disabled button</button>
<button (click)="isDisabled=!isDisabled">toggle disable</button>


<button (click)="showMessage()">Show Message</button>

<app-user></app-user>
<app-students></app-students>


<router-outlet />
